<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>GeneoGraph place autocomplete cancellation regression</title>
</head>
<body>
    <h1>Place autocomplete browser regression</h1>
    <p>This page uses mock provider responses and test-only credentials.</p>
    <div data-place-combobox>
        <input id="place" data-place-input data-place-project-id="test-project"
            autocomplete="off" aria-label="Test place">
        <div id="testOptions" class="place-combobox-list" hidden></div>
    </div>
    <pre id="testResult" data-result="running">Running browser tests…</pre>

    <script>
        // Isolated globals used by the REAL shared combobox and adapter scripts.
        // No requests leave this page and no production credentials are loaded.
        window.GENEOGRAPH_CONFIG = {
            geoapifyKey: 'fake-test-only', locationiqKey: 'fake-test-only'
        };
        const state = { language: 'en' };
        const sampleData = { places: [] };
        const PLACE_EDITOR_GEOCODER_MIN_LENGTH = 3;
        const PLACE_EDITOR_GEOCODER_DEBOUNCE_MS = 300;
        function currentProjectId() { return 'test-project'; }
        function findExactPlaceMatch() { return null; }
        function normalizePlaceLookupText(value) {
            return String(value || '').trim().toLowerCase();
        }
        function t(value) { return value; }
        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;',
                '"': '&quot;', "'": '&#39;'
            })[char]);
        }
        function localizedDataFieldValue(value) { return String(value || ''); }

        const testEvents = { unhandled: [], errors: [], fetches: [], aborted: [] };
        window.addEventListener('unhandledrejection', event => {
            testEvents.unhandled.push(String(event.reason));
        });
        window.addEventListener('error', event => {
            testEvents.errors.push(String(event.message));
        });

        let responseMode = 'normal';
        window.fetch = (url, { signal } = {}) => new Promise((resolve, reject) => {
            const request = new URL(url);
            const source = request.hostname.includes('geoapify') ? 'geoapify' : 'locationiq';
            const query = request.searchParams.get('text') || request.searchParams.get('q');
            testEvents.fetches.push({ source, query });
            let settled = false;
            const abort = () => {
                if (settled) return;
                settled = true;
                clearTimeout(timer);
                testEvents.aborted.push({ source, query });
                reject(signal.reason || new DOMException('cancelled', 'AbortError'));
            };
            const timer = setTimeout(() => {
                if (settled) return;
                settled = true;
                signal?.removeEventListener('abort', abort);
                if (source === 'geoapify' && responseMode === 'primary-error') {
                    resolve(new Response(null, { status: 401 }));
                    return;
                }
                if (source === 'geoapify' && responseMode === 'primary-empty') {
                    resolve(new Response(JSON.stringify({ results: [] }), { status: 200 }));
                    return;
                }
                const item = source === 'geoapify'
                    ? { name: query, formatted: query + ', Ukraine',
                        lat: 46.4846, lon: 30.7326 }
                    : { display_place: query, display_name: query + ', Ukraine',
                        display_address: 'Ukraine', lat: 46.4846, lon: 30.7326 };
                resolve(new Response(JSON.stringify(
                    source === 'geoapify' ? { results: [item] } : [item]
                ), { status: 200 }));
            }, 850);
            if (signal?.aborted) abort();
            else signal?.addEventListener('abort', abort, { once: true });
        });
    </script>
    <script src="../../src/core/geocoder-adapter.js"></script>
    <script src="../../src/shared/date-and-place-fields.js"></script>
    <script>
        function assert(condition, explanation) {
            if (!condition) throw new Error(explanation);
        }
        const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
        const input = document.querySelector('#place');
        const results = document.querySelector('#testOptions');
        const report = document.querySelector('#testResult');
        function type(value) {
            input.value = value;
            input.dispatchEvent(new Event('input', { bubbles: true }));
        }
        async function test() {
            bindPlaceComboboxes(document);
            input.focus();

            // A request has started by 350 ms. New input cancels it and
            // starts another only after the next 300 ms pause.
            type('Ode');
            await delay(370);
            type('Odes');
            await delay(370);
            type('Odesa');
            await delay(1250);
            assert(testEvents.fetches.filter(item => item.source === 'geoapify').length === 3,
                'Expected three debounced requests after three typing pauses');
            assert(testEvents.aborted.length === 2,
                'Expected the two superseded requests to be cancelled');
            assert(testEvents.fetches.every(item => item.source === 'geoapify'),
                'An intentional abort must not trigger the LocationIQ fallback');
            assert(results.textContent.includes('Odesa, Ukraine'),
                'Latest query should be visible; older results must be ignored');
            assert(!results.textContent.includes('Odes, Ukraine'),
                'Stale results must not overwrite latest suggestions');

            // Keystrokes inside the debounce window should produce one request.
            const count = testEvents.fetches.length;
            type('L');
            await delay(40);
            type('Lv');
            await delay(40);
            type('Lvi');
            await delay(40);
            type('Lviv');
            await delay(1250);
            assert(testEvents.fetches.length === count + 1,
                'Rapid typing must coalesce into one autocomplete request');

            // Escape while a request is pending cancels quietly.
            type('Roma');
            await delay(360);
            const cancelled = testEvents.aborted.length;
            input.dispatchEvent(new KeyboardEvent('keydown',
                { key: 'Escape', bubbles: true }));
            await delay(150);
            assert(testEvents.aborted.length === cancelled + 1,
                'Closing the popup must cancel its active request');

            // A genuine no-results primary response still falls back.
            responseMode = 'primary-empty';
            const preEmpty = testEvents.fetches.length;
            type('Zhovkva');
            await delay(2350);
            assert(testEvents.fetches.slice(preEmpty).map(item => item.source).join(',')
                === 'geoapify,locationiq',
                'Primary no-results must fall back to LocationIQ');
            assert(results.textContent.includes('Zhovkva'),
                'The fallback suggestion should appear');

            // Real provider authorization errors must still trigger fallback.
            responseMode = 'primary-error';
            const preError = testEvents.fetches.length;
            type('Chernihiv');
            await delay(2350);
            assert(testEvents.fetches.slice(preError).map(item => item.source).join(',')
                === 'geoapify,locationiq',
                'Primary HTTP 401 should trigger LocationIQ');
            assert(results.textContent.includes('Chernihiv'),
                'Fallback should display suggestions after primary 401');

            await delay(100);
            assert(testEvents.unhandled.length === 0,
                'No unhandled promise rejections: ' + testEvents.unhandled.join('; '));
            assert(testEvents.errors.length === 0,
                'No JavaScript errors: ' + testEvents.errors.join('; '));
            report.dataset.result = 'pass';
            report.textContent = 'PASS: debouncing, cancellation, stale results,'
                + ' Escape, provider fallbacks and unhandled-rejection checks.';
        }
        test().catch(error => {
            report.dataset.result = 'fail';
            report.textContent = 'FAIL: ' + error.message;
            console.error(error);
        });
    </script>
</body>
</html>
