# yaml-language-server: $schema=https://json.schemastore.org/github-issue-forms.json

name: Feature request
description: Suggest feature for integration.
labels:
    - "enhancement"

body:
    # Feature information
    - type: textarea
      id: formulation
      attributes:
          label: User problem and outcome
          description: >
              Explain who needs this and what they should accomplish.
      validations:
          required: true
    - type: textarea
      id: solution
      attributes:
          label: Proposed behavior
          description: >
              Describe the intended user journey and important boundaries.
    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives
          description: >
              Description of any alternative solutions or features.

    # Options
    - type: textarea
      id: additional
      attributes:
          label: Additional context
          description: >
              Add any other context or screenshots about the feature request here.
