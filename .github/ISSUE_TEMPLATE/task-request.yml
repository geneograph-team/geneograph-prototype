# yaml-language-server: $schema=https://json.schemastore.org/github-issue-forms.json

name: Task request
description: Suggest task for complete.
labels:
    - "task"

body:
    # Task information
    - type: textarea
      id: formulation
      attributes:
          label: Goal and scope
          description: >
              Describe the outcome, affected areas and important boundaries.
    - type: textarea
      id: solution
      attributes:
          label: Acceptance criteria
          description: >
              Describe observable conditions for considering this task done.
    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives
          description: >
              Description of any alternative solutions or features.

    # Options
    - type: textarea
      id: additional
      attributes:
          label: Additional context
          description: >
              Add any other context or screenshots about the task request.
