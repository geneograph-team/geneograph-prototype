name: Check place autocomplete

on:
    push:
        branches:
            - "fix/place-search-lifecycle"
    pull_request:
        paths:
            - "src/core/geocoder-adapter.js"
            - "src/shared/date-and-place-fields.js"
            - "src/modules/places/editor.js"
            - "src/modules/geneograph/geneograph-pickers.js"
            - "scripts/check-place-search-lifecycle.cjs"
            - "tests/browser/place-search-cancellation.html"
            - ".github/workflows/check-place-search.yml"

permissions:
    contents: read

jobs:
    verify-place-search:
        runs-on: ubuntu-24.04
        timeout-minutes: 6
        steps:
            - name: Check out source
              uses: actions/checkout@v7

            - name: Run Node lifecycle regression
              run: node scripts/check-place-search-lifecycle.cjs

            - name: Check changed JavaScript syntax
              run: |
                  node --check src/core/geocoder-adapter.js
                  node --check src/shared/date-and-place-fields.js
                  node --check src/modules/places/editor.js
                  node --check src/modules/geneograph/geneograph-pickers.js

            - name: Verify real-browser combobox cancellation
              shell: bash
              run: |
                  chrome="$(command -v google-chrome || command -v chromium || true)"
                  if [[ -z "$chrome" ]]; then
                      echo "Chromium/Chrome is required for this regression test."
                      exit 1
                  fi
                  url="file://${GITHUB_WORKSPACE}/tests/browser/place-search-cancellation.html"
                  dom="$("$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=18000 --dump-dom "$url" 2>/dev/null)"
                  if [[ "$dom" != *'data-result="pass"'* ]]; then
                      echo "Place combobox browser regression failed:"
                      printf '%s\n' "$dom" | tail -n 16
                      exit 1
                  fi
                  echo "Place combobox browser cancellation regression passed."
