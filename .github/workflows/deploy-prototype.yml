# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: "Deploy prototype"

on:
    push:
        branches:
            - "default"
        paths:
            - ".github/workflows/**"
            - "src/**"
            - "*.html"
            - "*.css"
            - "*.js"

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

defaults:
    run:
        shell: pwsh

jobs:
    build-prototype:
        name: "Build prototype"

        strategy:
            matrix:
                system:
                    - ubuntu-24.04

        runs-on: ${{ matrix.system }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Build prototype
              run: |
                  mkdir `
                      -p ${{ github.workspace }}/dist/
                  Copy-Item `
                      -Path ${{ github.workspace }}/src/* `
                      -Destination ${{ github.workspace }}/dist/ `
                      -Recurse

            # Browser tokens are public in the deployed artifact. Repository secrets
            # prevent committing them to source; provider restrictions remain essential.
            - name: Inject public geocoder tokens into deployment copy
              env:
                  GEOAPIFY_BROWSER_KEY: ${{ secrets.GEOAPIFY_BROWSER_KEY }}
                  LOCATIONIQ_BROWSER_KEY: ${{ secrets.LOCATIONIQ_BROWSER_KEY }}
              run: |
                  $config = @{
                      geoapifyKey = [string]$env:GEOAPIFY_BROWSER_KEY
                      locationiqKey = [string]$env:LOCATIONIQ_BROWSER_KEY
                  } | ConvertTo-Json -Compress
                  $destination = Join-Path '${{ github.workspace }}' 'dist/browser-config.js'
                  [System.IO.File]::WriteAllText($destination, "window.GENEOGRAPH_CONFIG = $config;")
                  if ([string]::IsNullOrWhiteSpace($env:GEOAPIFY_BROWSER_KEY) -or
                      [string]::IsNullOrWhiteSpace($env:LOCATIONIQ_BROWSER_KEY)) {
                      Write-Warning 'Geocoder keys missing; manual place entry remains available.'
                  }

            - name: Upload prototype
              id: deployment
              uses: actions/upload-pages-artifact@v5
              with:
                  path: ${{ github.workspace }}/dist

    deploy-prototype:
        name: "Deploy prototype"

        needs:
            - build-prototype

        strategy:
            matrix:
                system:
                    - ubuntu-24.04

        runs-on: ${{ matrix.system }}

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy prototype
              id: deployment
              uses: actions/deploy-pages@v5
