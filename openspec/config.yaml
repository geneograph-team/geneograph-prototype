schema: spec-driven

context: |
  GeneoGraph is a static browser prototype in src/ with seeded sample data, in-memory project state, English/Russian UI, and no build step or backend. Product_Vision.md describes direction, not necessarily current behavior.
  Read AGENTS.md for repository conventions and doc/design-document.md for the current design and engineering guide. Verify claims against code before adding durable specs.
  Keep main specs to verified current behavior and proposed work in focused change folders. Investigate the complete affected workflow and data dependencies with targeted reads; avoid repeated reads and unrelated refactors. Surgical patches limit implementation churn, not assessment. Treat reported symptoms as evidence and include adjacent cases needed to fulfill the same intent. Edit styles in their owning stylesheet; reconcile existing declarations rather than adding override layers or duplicates.
  Define acceptance by the user outcome, including relevant initial, selected, staged, canceled, and applied states; missing/already-linked records; and both transfer directions. Status, visible differences, actions, previews, and saved results must agree.
  Scope verification to change risk: check affected browser workflows and the console; add automated checks only for meaningful regressions. Syntax and focused tests do not prove usability or visual completeness; user-owned browser QA does not replace data-flow and state-transition review. Stop when outcome-based acceptance criteria pass and remaining verification limits are explicit; keep summaries concise and omit large diffs. Codex local work must not run Git commands or commit changes; leave version control to the user. Review edited files directly for whitespace issues instead of running git diff --check.
  OpenSpec closeout: after completed substantive work, automatically consolidate verified requirements into openspec/specs/ and archive the change under openspec/changes/archive/YYYY-MM-DD-name/ in the same work item. Do not claim unperformed QA as executed. Do not edit CI/deployment to automate archive jobs.
